services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - ENV=local
      - CORS_ORIGINS=http://localhost:3000
      # GROQ_API_KEY=... (optional; without it the stack runs in browser-native fallback mode)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on: [api]
